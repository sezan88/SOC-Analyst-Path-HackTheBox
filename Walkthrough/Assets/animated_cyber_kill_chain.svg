<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2100 300" width="2100" height="300">
<title>Animated Cyber Kill Chain</title>
<desc>Seven stages of the cyber kill chain connected by animated flowing arrows.</desc>
<style>
@keyframes dash { to { stroke-dashoffset: -48; } }
@keyframes pulseMove { 0% { transform: translateX(0); opacity: 1; } 45% { opacity: .25; } 100% { transform: translateX(13px); opacity: 1; } }
.flow-line { animation: dash 0.8s linear infinite; }
.flow-pulse { animation: pulseMove 1.1s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .flow-line, .flow-pulse { animation: none; } }
</style>
<rect width="2100" height="300" fill="#000"/>
<defs>
<filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="box" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#76b852"/><stop offset="1" stop-color="#65a842"/></linearGradient>
</defs>
<rect x="2" y="70" width="218" height="130" rx="12" fill="url(#box)" stroke="#fff" stroke-width="4"/>
<text x="113" y="146" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="34" fill="white">Recon</text>
<rect x="305" y="70" width="218" height="130" rx="12" fill="url(#box)" stroke="#fff" stroke-width="4"/>
<text x="416" y="146" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="34" fill="white">Weaponize</text>
<rect x="608" y="70" width="218" height="130" rx="12" fill="url(#box)" stroke="#fff" stroke-width="4"/>
<text x="719" y="146" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="34" fill="white">Deliver</text>
<rect x="911" y="70" width="218" height="130" rx="12" fill="url(#box)" stroke="#fff" stroke-width="4"/>
<text x="1022" y="146" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="34" fill="white">Exploit</text>
<rect x="1214" y="70" width="218" height="130" rx="12" fill="url(#box)" stroke="#fff" stroke-width="4"/>
<text x="1325" y="146" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="34" fill="white">Install</text>
<rect x="1517" y="70" width="218" height="130" rx="12" fill="url(#box)" stroke="#fff" stroke-width="4"/>
<text x="1628" y="146" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="34" fill="white">C&amp;C</text>
<rect x="1820" y="70" width="218" height="130" rx="12" fill="url(#box)" stroke="#fff" stroke-width="4"/>
<text x="1931" y="146" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="34" fill="white">Action</text>
<g filter="url(#glow)">
  <path class="flow-line" d="M 242 135 H 255" fill="none" stroke="#b7d7ad" stroke-width="12" stroke-dasharray="14 10"/>
  <polygon points="255,116 283,150 255,184" fill="#b7d7ad"/>
  <circle class="flow-pulse" cx="242" cy="135" r="5" fill="#eaffdf"/>
</g>
<g filter="url(#glow)">
  <path class="flow-line" d="M 545 135 H 558" fill="none" stroke="#b7d7ad" stroke-width="12" stroke-dasharray="14 10"/>
  <polygon points="558,116 586,150 558,184" fill="#b7d7ad"/>
  <circle class="flow-pulse" cx="545" cy="135" r="5" fill="#eaffdf"/>
</g>
<g filter="url(#glow)">
  <path class="flow-line" d="M 848 135 H 861" fill="none" stroke="#b7d7ad" stroke-width="12" stroke-dasharray="14 10"/>
  <polygon points="861,116 889,150 861,184" fill="#b7d7ad"/>
  <circle class="flow-pulse" cx="848" cy="135" r="5" fill="#eaffdf"/>
</g>
<g filter="url(#glow)">
  <path class="flow-line" d="M 1151 135 H 1164" fill="none" stroke="#b7d7ad" stroke-width="12" stroke-dasharray="14 10"/>
  <polygon points="1164,116 1192,150 1164,184" fill="#b7d7ad"/>
  <circle class="flow-pulse" cx="1151" cy="135" r="5" fill="#eaffdf"/>
</g>
<g filter="url(#glow)">
  <path class="flow-line" d="M 1454 135 H 1467" fill="none" stroke="#b7d7ad" stroke-width="12" stroke-dasharray="14 10"/>
  <polygon points="1467,116 1495,150 1467,184" fill="#b7d7ad"/>
  <circle class="flow-pulse" cx="1454" cy="135" r="5" fill="#eaffdf"/>
</g>
<g filter="url(#glow)">
  <path class="flow-line" d="M 1757 135 H 1770" fill="none" stroke="#b7d7ad" stroke-width="12" stroke-dasharray="14 10"/>
  <polygon points="1770,116 1798,150 1770,184" fill="#b7d7ad"/>
  <circle class="flow-pulse" cx="1757" cy="135" r="5" fill="#eaffdf"/>
</g>
</svg>