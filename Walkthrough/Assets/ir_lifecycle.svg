<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1382 657" width="1382" height="657">
<title>Incident Response Life Cycle Model</title>
<desc>Four-stage IR lifecycle: Preparation, Detection and Analysis, Containment Eradication and Recovery, Post-Incident Activity, with forward and feedback arrows.</desc>

<style>
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .2; } }
  .step { animation: blink 2.4s ease-in-out infinite; }
  .s1 { animation-delay: 0s; }
  .s2 { animation-delay: 0.4s; }
  .s3 { animation-delay: 0.8s; }
  .s4 { animation-delay: 1.2s; }
  .s5 { animation-delay: 1.6s; }
  .s6 { animation-delay: 2.0s; }
  @media (prefers-reduced-motion: reduce) { .step { animation: none; } }
</style>

<defs>
  <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#1f9e8f"/><stop offset="100%" stop-color="#0e6b62"/>
  </linearGradient>
  <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f0932b"/><stop offset="100%" stop-color="#c96a12"/>
  </linearGradient>
  <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#b3122a"/><stop offset="100%" stop-color="#7a0c1d"/>
  </linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#7c93ac"/><stop offset="100%" stop-color="#54677f"/>
  </linearGradient>
  <linearGradient id="arrowGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#a9a9a9"/><stop offset="100%" stop-color="#7f7f7f"/>
  </linearGradient>
</defs>

<rect width="1382" height="657" rx="24" fill="#0d1626"/>

<!-- ===== Top feedback arrow: Analysis -> Containment ===== -->
<path d="M 520 190 V 130 Q 520 110 540 110 H 850 Q 870 110 870 130 V 175"
      fill="none" stroke="url(#arrowGrad)" stroke-width="26" stroke-linecap="round"/>
<polygon class="step s2" points="870,175 855,205 885,205" fill="#9a9a9a"/>

<!-- ===== Bottom feedback arrow: Containment -> Analysis ===== -->
<path d="M 870 425 V 480 Q 870 500 850 500 H 540 Q 520 500 520 480 V 435"
      fill="none" stroke="url(#arrowGrad)" stroke-width="26" stroke-linecap="round"/>
<polygon class="step s4" points="520,435 505,405 535,405" fill="#9a9a9a"/>

<!-- ===== Long bottom feedback arrow: Post-Incident -> Preparation ===== -->
<path d="M 1215 425 V 545 Q 1215 565 1195 565 H 210 Q 190 565 190 545 V 490"
      fill="none" stroke="url(#arrowGrad)" stroke-width="26" stroke-linecap="round"/>
<polygon class="step s6" points="190,490 175,460 205,460" fill="#9a9a9a"/>

<!-- ===== Forward arrows between boxes ===== -->
<g fill="#9a9a9a">
  <polygon class="step s1" points="303,290 350,290 350,270 375,315 350,360 350,340 303,340"/>
  <polygon class="step s3" points="655,290 702,290 702,270 727,315 702,360 702,340 655,340"/>
  <polygon class="step s5" points="1007,290 1054,290 1054,270 1079,315 1054,360 1054,340 1007,340"/>
</g>

<!-- ===== Box 1: Preparation ===== -->
<g>
  <rect x="46" y="203" width="240" height="200" rx="20" fill="url(#teal)"/>
  <g transform="translate(166,258)" fill="none" stroke="#eef6f4" stroke-width="6">
    <path d="M0,-40 L34,-25 V8 C34,32 17,48 0,55 C-17,48 -34,32 -34,8 V-25 Z" stroke-linejoin="round"/>
    <path d="M-16,-2 L-4,12 L18,-16" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="166" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#ffffff">Preparation</text>
</g>

<!-- ===== Box 2: Detection and Analysis ===== -->
<g>
  <rect x="398" y="203" width="240" height="200" rx="20" fill="url(#orange)"/>
  <g transform="translate(518,265)" fill="none" stroke="#fdf3ea" stroke-width="6" stroke-linecap="round">
    <circle cx="-6" cy="-8" r="26"/>
    <line x1="13" y1="11" x2="34" y2="32"/>
  </g>
  <text x="518" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#ffffff">
    <tspan x="518" dy="0">Detection and</tspan>
    <tspan x="518" dy="26">Analysis</tspan>
  </text>
</g>

<!-- ===== Box 3: Containment, Eradication and Recovery ===== -->
<g>
  <rect x="750" y="203" width="240" height="200" rx="20" fill="url(#red)"/>
  <g transform="translate(870,262)" fill="#fdf0f1">
    <rect x="-38" y="-6" width="52" height="26" rx="3"/>
    <rect x="14" y="2" width="24" height="18" rx="2"/>
    <circle cx="-22" cy="24" r="8" fill="#7a0c1d" stroke="#fdf0f1" stroke-width="4"/>
    <circle cx="18" cy="24" r="8" fill="#7a0c1d" stroke="#fdf0f1" stroke-width="4"/>
    <path d="M-6,-6 V-22 M-13,-14 H1" stroke="#fdf0f1" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="870" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#ffffff">
    <tspan x="870" dy="0">Containment,</tspan>
    <tspan x="870" dy="26">Eradication and</tspan>
    <tspan x="870" dy="26">Recovery</tspan>
  </text>
</g>

<!-- ===== Box 4: Post-Incident Activity ===== -->
<g>
  <rect x="1102" y="203" width="240" height="200" rx="20" fill="url(#blue)"/>
  <g transform="translate(1222,258)" fill="none" stroke="#eef2f6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-24" y="-32" width="48" height="66" rx="5"/>
    <rect x="-10" y="-38" width="20" height="12" rx="3" fill="#eef2f6" stroke="none"/>
    <line x1="-14" y1="-8" x2="10" y2="-8"/>
    <line x1="-14" y1="2" x2="10" y2="2"/>
    <line x1="-14" y1="12" x2="10" y2="12"/>
    <line x1="-14" y1="22" x2="2" y2="22"/>
  </g>
  <text x="1222" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#ffffff">
    <tspan x="1222" dy="0">Post-Incident</tspan>
    <tspan x="1222" dy="26">Activity</tspan>
  </text>
</g>

<text x="691" y="617" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#e6e6e6">Incident Response Life Cycle Model</text>

</svg>
