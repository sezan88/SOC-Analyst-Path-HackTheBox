<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1660 940" width="1660" height="940">
<title>Incident Handling Preparation Prerequisites</title>
<desc>Four prerequisites for incident handling preparation: Protect against and prevent IT security incidents, Clear Policies, Documentation, Tools, connected by an animated dashed loop, with small shapes drifting in the background and each bar blinking in sequence.</desc>

<style>
  @keyframes blinkBar { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  .bar1 { animation: blinkBar 8.192s ease-in-out infinite; animation-delay: 0s; }
  .bar2 { animation: blinkBar 8.192s ease-in-out infinite; animation-delay: 2.048s; }
  .bar3 { animation: blinkBar 8.192s ease-in-out infinite; animation-delay: 4.096s; }
  .bar4 { animation: blinkBar 8.192s ease-in-out infinite; animation-delay: 6.144s; }

  @keyframes dashFlow { to { stroke-dashoffset: -40; } }
  .flow { stroke-dasharray: 8 8; animation: dashFlow 1.4s linear infinite; }

  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .shape-a { animation: spin 6s linear infinite; transform-origin: center; transform-box: fill-box; }
  .shape-b { animation: spin 8s linear infinite reverse; transform-origin: center; transform-box: fill-box; }
  .shape-c { animation: spin 5s linear infinite; transform-origin: center; transform-box: fill-box; }

  @media (prefers-reduced-motion: reduce) {
    .bar1, .bar2, .bar3, .bar4, .flow, .shape-a, .shape-b, .shape-c { animation: none; }
  }
</style>

<defs>
  <linearGradient id="blueBar" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#1f6fd6"/><stop offset="100%" stop-color="#3fa9f5"/>
  </linearGradient>
  <linearGradient id="greenBar" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#1f7a35"/><stop offset="100%" stop-color="#5bc25b"/>
  </linearGradient>
  <linearGradient id="orangeBar" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#d9770c"/><stop offset="100%" stop-color="#f5b731"/>
  </linearGradient>
  <linearGradient id="pinkBar" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#c21e6b"/><stop offset="100%" stop-color="#e94f8a"/>
  </linearGradient>

  <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#3fa9f5" stop-opacity="0.9"/><stop offset="100%" stop-color="#3fa9f5" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="greenGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#5bc25b" stop-opacity="0.9"/><stop offset="100%" stop-color="#5bc25b" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="orangeGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#f5b731" stop-opacity="0.9"/><stop offset="100%" stop-color="#f5b731" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="pinkGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#e94f8a" stop-opacity="0.9"/><stop offset="100%" stop-color="#e94f8a" stop-opacity="0"/>
  </radialGradient>

  <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="10"/>
  </filter>
</defs>

<rect width="1660" height="940" fill="#070b16"/>

<!-- background decorative shapes (static-ish scattered) -->
<g stroke-width="2" fill="none" opacity="0.8">
  <polygon class="shape-a" points="220,60 240,95 200,95" stroke="#2f8fd6"/>
  <circle class="shape-b" cx="107" cy="132" r="10" stroke="#2f8fd6"/>
  <polygon class="shape-c" points="62,290 82,325 42,325" stroke="#7b3fe6"/>
  <circle class="shape-a" cx="195" cy="677" r="9" stroke="#7b3fe6"/>
  <circle class="shape-b" cx="1400" cy="82" r="9" stroke="#7b3fe6"/>
  <rect class="shape-c" x="1560" y="670" width="16" height="16" stroke="#f5b731"/>
  <polygon class="shape-a" points="1480,730 1498,762 1462,762" stroke="#f5b731"/>
  <rect class="shape-b" x="200" y="880" width="20" height="20" fill="none" stroke="#e94f8a"/>
</g>
<g class="shape-a" fill="#3fa9f5">
  <rect x="1465" y="855" width="18" height="4"/><rect x="1472" y="848" width="4" height="18"/>
</g>
<g class="shape-b" fill="#5bc25b">
  <rect x="1400" y="895" width="18" height="4"/><rect x="1407" y="888" width="4" height="18"/>
</g>

<!-- dotted grids -->
<g fill="#2f5faa" opacity="0.7">
  <circle cx="1580" cy="60" r="2.5"/><circle cx="1600" cy="60" r="2.5"/><circle cx="1620" cy="60" r="2.5"/>
  <circle cx="1580" cy="80" r="2.5"/><circle cx="1600" cy="80" r="2.5"/><circle cx="1620" cy="80" r="2.5"/>
  <circle cx="1580" cy="100" r="2.5"/><circle cx="1600" cy="100" r="2.5"/><circle cx="1620" cy="100" r="2.5"/>
</g>
<g fill="#e94f8a" opacity="0.7">
  <circle cx="60" cy="900" r="2.5"/><circle cx="80" cy="900" r="2.5"/><circle cx="100" cy="900" r="2.5"/>
  <circle cx="60" cy="920" r="2.5"/><circle cx="80" cy="920" r="2.5"/><circle cx="100" cy="920" r="2.5"/>
</g>

<!-- ===== Connector loop: left side (bar1-bar2 & bar3-bar4), and outer loop for bar1..bar4 ===== -->
<!-- left vertical connectors -->
<path class="flow" d="M 232 205 Q 165 205 165 275 Q 165 345 232 345" fill="none" stroke="#3fa9f5" stroke-width="3"/>
<path class="flow" d="M 197 345 L 197 345" fill="none" stroke="#5bc25b" stroke-width="3"/>
<path class="flow" d="M 197 345 Q 165 345 165 415 Q 165 485 197 485" fill="none" stroke="#5bc25b" stroke-width="3"/>
<path class="flow" d="M 197 485 Q 165 485 165 555 Q 165 625 232 625" fill="none" stroke="#f5b731" stroke-width="3"/>

<!-- right vertical connectors -->
<path class="flow" d="M 1428 205 Q 1495 205 1495 275 Q 1495 345 1428 345" fill="none" stroke="#3fa9f5" stroke-width="3"/>
<path class="flow" d="M 1428 345 Q 1495 345 1495 415 Q 1495 485 1428 485" fill="none" stroke="#5bc25b" stroke-width="3"/>
<path class="flow" d="M 1428 485 Q 1495 485 1495 555 Q 1495 625 1428 625" fill="none" stroke="#f5b731" stroke-width="3"/>

<!-- connector node dots -->
<g fill="#ffffff">
  <circle cx="232" cy="205" r="9"/>
  <circle cx="197" cy="345" r="9"/>
  <circle cx="197" cy="485" r="9"/>
  <circle cx="232" cy="625" r="9"/>
  <circle cx="1428" cy="205" r="9"/>
  <circle cx="1428" cy="345" r="9"/>
  <circle cx="1428" cy="485" r="9"/>
  <circle cx="1428" cy="625" r="9"/>
</g>

<!-- ================= BAR 1: Protect ================= -->
<g class="bar1">
  <rect x="450" y="120" width="978" height="130" rx="65" fill="url(#blueBar)"/>
  <text x="570" y="197" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="#ffffff">Protect against &amp; prevent IT security incidents</text>
  <circle cx="435" cy="185" r="72" fill="url(#blueGlow)" filter="url(#softBlur)"/>
  <circle cx="435" cy="185" r="62" fill="#1360b3" stroke="#7ec8ff" stroke-width="3"/>
  <g transform="translate(435,185)" fill="#ffffff">
    <path d="M0,-30 L26,-19 V6 C26,24 13,37 0,42 C-13,37 -26,24 -26,6 V-19 Z"/>
    <rect x="-11" y="-4" width="22" height="17" rx="3" fill="#1360b3"/>
    <path d="M-7,-4 V-10 A7,7 0 0 1 7,-10 V-4" fill="none" stroke="#1360b3" stroke-width="4"/>
  </g>
</g>

<!-- ================= BAR 2: Clear Policies ================= -->
<g class="bar2">
  <rect x="450" y="260" width="978" height="130" rx="65" fill="url(#greenBar)"/>
  <text x="570" y="337" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="#ffffff">Clear Policies</text>
  <circle cx="435" cy="325" r="72" fill="url(#greenGlow)" filter="url(#softBlur)"/>
  <circle cx="435" cy="325" r="62" fill="#1f7a35" stroke="#8de08d" stroke-width="3"/>
  <g transform="translate(435,325)" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-18" y="-26" width="36" height="46" rx="4" fill="#ffffff" stroke="none"/>
    <line x1="-10" y1="-14" x2="10" y2="-14" stroke="#1f7a35"/>
    <line x1="-10" y1="-4" x2="10" y2="-4" stroke="#1f7a35"/>
    <line x1="-10" y1="6" x2="4" y2="6" stroke="#1f7a35"/>
    <circle cx="10" cy="16" r="11" fill="#2fae4a" stroke="none"/>
    <path d="M5,16 L9,20 L16,11" stroke="#ffffff" stroke-width="3"/>
  </g>
</g>

<!-- ================= BAR 3: Documentation ================= -->
<g class="bar3">
  <rect x="450" y="400" width="978" height="130" rx="65" fill="url(#orangeBar)"/>
  <text x="570" y="477" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="#ffffff">Documentation</text>
  <circle cx="435" cy="465" r="72" fill="url(#orangeGlow)" filter="url(#softBlur)"/>
  <circle cx="435" cy="465" r="62" fill="#c9720c" stroke="#ffd27a" stroke-width="3"/>
  <g transform="translate(435,465)" fill="#ffffff">
    <path d="M-26,-8 L-26,18 A6,6 0 0 0 -20,24 H20 A6,6 0 0 0 26,18 V-2 A6,6 0 0 0 20,-8 H0 L-6,-16 H-20 A6,6 0 0 0 -26,-8 Z"/>
  </g>
</g>

<!-- ================= BAR 4: Tools ================= -->
<g class="bar4">
  <rect x="450" y="540" width="978" height="130" rx="65" fill="url(#pinkBar)"/>
  <text x="570" y="617" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="#ffffff">Tools (Software &amp; Hardware)</text>
  <circle cx="435" cy="605" r="72" fill="url(#pinkGlow)" filter="url(#softBlur)"/>
  <circle cx="435" cy="605" r="62" fill="#a81856" stroke="#ff9dc4" stroke-width="3"/>
  <g transform="translate(435,605)" fill="#ffffff">
    <circle r="12" fill="none" stroke="#ffffff" stroke-width="6"/>
    <g stroke="#ffffff" stroke-width="6" stroke-linecap="round">
      <line x1="0" y1="-26" x2="0" y2="-18"/>
      <line x1="0" y1="18" x2="0" y2="26"/>
      <line x1="-26" y1="0" x2="-18" y2="0"/>
      <line x1="18" y1="0" x2="26" y2="0"/>
      <line x1="-18" y1="-18" x2="-13" y2="-13"/>
      <line x1="13" y1="13" x2="18" y2="18"/>
      <line x1="-18" y1="18" x2="-13" y2="13"/>
      <line x1="13" y1="-13" x2="18" y2="-18"/>
    </g>
  </g>
</g>

<!-- Title -->
<text x="830" y="785" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#ffffff">Incident Handling Preparation Prerequisites</text>

<!-- divider -->
<g>
  <rect x="600" y="822" width="150" height="6" rx="3" fill="#3fa9f5"/>
  <circle cx="775" cy="825" r="6" fill="#3fa9f5"/>
  <circle cx="800" cy="825" r="6" fill="#5bc25b"/>
  <circle cx="825" cy="825" r="6" fill="#f5b731"/>
  <circle cx="850" cy="825" r="6" fill="#e94f8a"/>
  <rect x="880" y="822" width="150" height="6" rx="3" fill="#e94f8a"/>
</g>

</svg>
